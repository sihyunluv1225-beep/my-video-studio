<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Pret';src:url(PretendardVariable.woff2) format('woff2');font-weight:45 920;}
@font-face{font-family:'Corm';src:url(cormorant-garamond-latin-600-italic.woff2);font-style:italic;font-weight:600;}
html,body{margin:0;background:#000;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0410;font-family:'Pret',sans-serif;color:#fff;}
.L{position:absolute;inset:0;}
.bg{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;}
/* reference look: heavy centered sans, pastel fill, soft drop shadow */
.c{position:absolute;left:40px;right:40px;text-align:center;font-weight:850;letter-spacing:-1px;line-height:1.12;
   text-shadow:0 3px 12px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35);}
.P{color:#FF62D9;text-shadow:0 3px 14px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.5);}           /* brand point colour: 지금바레 · 광교에듀타운점 */
.ital{font-family:'Corm',serif;font-style:italic;font-weight:600;}
</style></head>
<body><div id="stage"></div>
<script>
const B = 60/128;              // one beat @128BPM
const DUR = 32*B;              // = 15.0s
const S = document.getElementById('stage');
// pastel page colours (rotate page by page, like the reference carousel)
const YEL='#FFE68A', LAV='#E3B8FF', SKY='#C9E2FF', CREAM='#FFF6E4';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rnd(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
const P=s=>`<span class="P">${s}</span>`;

function bg(src,{pos='50% 50%',scale=1,tx=0,ty=0,filter='',op=1}={}){
  return `<div class="bg" style="background-image:url(img/${src});background-position:${pos};transform:translate(${tx}px,${ty}px) scale(${scale});filter:${filter};opacity:${op}"></div>`;
}
function grad(css){return `<div class="L" style="background:${css}"></div>`;}
const dim=(a=.4)=>grad(`rgba(10,4,16,${a})`);
function flash(t,at,len=0.16,color='255,255,255'){
  const k=lin(t,at,at+len); if(t<at||k>=1) return '';
  return `<div class="L" style="background:rgba(${color},${(1-k)*0.9})"></div>`;
}
const punch=(t,s0,amt=0.18)=>1+amt*(1-eOut(lin(t,s0,s0+0.35)));
const up=(x,d=40)=>`opacity:${eOut(x)};transform:translateY(${(1-eOut(x))*d}px)`;
const shakeXY=(t,a,b,amp,seed)=>{const s=t>a?(1-lin(t,a,b)):0;return [(rnd(Math.floor(t*30)+seed)-.5)*amp*s,(rnd(Math.floor(t*30)+seed+5)-.5)*amp*s];};

const scenes=[];
const add=(s,e,fn)=>scenes.push({s,e,fn});

// S1 HOOK — butter yellow
add(0,4*B,(t)=>{
  const k=lin(t,-0.10,0.30), sc=2.6-1.6*eOut(k);
  const [sx,sy]=shakeXY(t,0.30,0.9,34,0);
  const g=lin(t,2*B,2*B+0.3), g2=lin(t,3*B,3*B+0.3);
  let h=bg('dark.jpg',{pos:'60% 50%',scale:1.35-0.12*lin(t,0,4*B),filter:'brightness(.7) saturate(1.1)'})+dim(.45);
  h+=`<div class="L" style="transform:translate(${sx}px,${sy}px);color:${YEL}">
    <div class="c" style="top:640px;font-size:320px;font-weight:900;letter-spacing:-8px;line-height:1;transform:scale(${sc});filter:blur(${(1-k)*12}px);opacity:${clamp(k*3)}">11.16</div>
    <div class="c" style="top:990px;font-size:120px;font-weight:900;letter-spacing:-2px;${up(g,60)}">GRAND OPEN</div>
    <div class="c" style="top:1150px;font-size:66px;${up(g2)}">${P('지금바레')} ${P('광교에듀타운점')}</div>
  </div>`;
  h+=flash(t,0.30,0.18)+flash(t,2*B,0.12,'255,230,138');
  return h;
});

// S2 exterior sign — lavender
add(4*B,8*B,(t,s)=>{
  const p=eInOut(lin(t,s,s+4*B));
  const a=lin(t,s+0.2,s+0.5), b2=lin(t,s+0.5,s+0.85);
  let h=bg('sign.jpg',{pos:`${8+70*p}% 50%`,scale:punch(t,s,0.25)*1.05,filter:'brightness(.85)'})+dim(.35);
  h+=`<div style="color:${LAV}">
      <div class="c" style="top:760px;font-size:104px;font-weight:900;${up(a)}">COMING SOON</div>
      <div class="c" style="top:910px;font-size:92px;${up(b2)}">${P('광교에듀타운')}에<br>${P('지금바레')}가 옵니다</div></div>`;
  h+=flash(t,s,0.14,'227,184,255');
  return h;
});

// S3 checklist — colour changes every page
const items=[
  {img:'barre_v.jpg',pos:'50% 60%',ko:'프리미엄 바',en:'BARRE',col:YEL},
  {img:'wide.jpg',pos:'62% 50%',ko:'무드 라이팅',en:'LIGHTING',col:LAV},
  {img:'curtain.jpg',pos:'40% 50%',ko:'전면 미러',en:'MIRROR',col:SKY},
  {img:'lounge.jpg',pos:'30% 40%',ko:'감성 라운지',en:'LOUNGE',col:YEL},
  {img:'desk.png',pos:'50% 50%',ko:'웰컴 데스크',en:'WELCOME',col:LAV},
  {img:'entrance.jpg',pos:'22% 50%',ko:'여성 전용 스튜디오',en:'LADIES ONLY',col:SKY},
];
add(8*B,20*B,(t,s)=>{
  const i=Math.min(5,Math.floor((t-s)/(2*B))), cs=s+i*2*B, it=items[i];
  const k=lin(t,cs+0.03,cs+0.28), k2=lin(t,cs+0.15,cs+0.4), ck=lin(t,cs+0.35,cs+0.6);
  const dir=i%2?1:-1;
  let h=bg(it.img,{pos:it.pos,scale:punch(t,cs,0.22)*1.06,tx:dir*30*lin(t,cs,cs+2*B),filter:'brightness(.85)'})+dim(.42);
  const prog=(i+eOut(ck))/6;
  h+=`<div style="color:${it.col}">
      <div class="c" style="top:600px;font-size:48px;letter-spacing:6px">OPEN CHECKLIST ${i+1}/6</div>
      <div class="c" style="top:720px;font-size:${it.en.length>8?128:150}px;font-weight:900;letter-spacing:-3px;${up(k,70)};transform:scale(${1.25-0.25*eOut(k)})">${it.en}</div>
      <div class="c" style="top:910px;font-size:84px;${up(k2)}">${it.ko}
        <span style="display:inline-block;vertical-align:middle;margin-left:14px;width:84px;height:84px;border-radius:50%;background:#FF4FCB;color:#fff;font-size:58px;line-height:84px;text-shadow:none;transform:scale(${eBack(ck)})">✓</span></div>
      <div style="position:absolute;left:180px;right:180px;top:1080px;height:12px;border-radius:6px;background:rgba(255,255,255,.25)">
        <div style="width:${prog*100}%;height:100%;border-radius:6px;background:#FF4FCB"></div></div>
      <div class="c" style="top:1110px;font-size:40px">${Math.round(prog*100)}%</div></div>`;
  h+=flash(t,cs,0.12);
  return h;
});

// S4 READY — sky blue
add(20*B,23*B,(t,s)=>{
  const k=lin(t,s+0.03,s+0.26), sc=2.2-1.2*eOut(k);
  const [sx,sy]=shakeXY(t,s+0.26,s+0.8,38,3);
  const sub=lin(t,s+0.6,s+0.9);
  let h=bg('room2.jpg',{pos:'55% 50%',scale:1.12+0.08*lin(t,s,s+3*B),filter:'brightness(.8)'})+dim(.45);
  h+=`<div class="L" style="transform:translate(${sx}px,${sy}px);color:${SKY}">
      <div class="c" style="top:640px;font-size:150px;font-weight:900;letter-spacing:-3px;line-height:1.02;transform:scale(${sc});filter:blur(${(1-k)*10}px);opacity:${clamp(k*3)}">READY<br>TO OPEN</div>
      <div class="c" style="top:990px;font-size:104px;${up(sub)}">오픈 준비 ${P('완료!')}</div></div>`;
  h+=flash(t,s+0.26,0.18);
  return h;
});

// S5 slogan — yellow, 지금 / 바레 pun in point colour
add(23*B,26*B,(t,s)=>{
  const w1=lin(t,s+0.05,s+0.35), w2=lin(t,s+0.3,s+0.6);
  let h=bg('bokeh.jpg',{pos:'8% 40%',scale:1.05+0.12*eOut(lin(t,s,s+3*B)),filter:'brightness(.8)'})+dim(.4);
  h+=`<div style="color:${YEL}">
      <div class="c" style="top:820px;font-size:118px;font-weight:900;letter-spacing:-2px;${up(w1)}">IT'S TIME<br>TO BARRE</div>
      <div class="c" style="top:1110px;font-size:84px;${up(w2)}">${P('지금')}, ${P('바레')}를<br>시작할 시간</div></div>`;
  h+=flash(t,s,0.12,'255,230,138');
  h+=`<div class="L" style="background:rgba(255,255,255,${eIn(lin(t,s+2.4*B,s+3*B))})"></div>`;
  return h;
});

// S7 End card
add(26*B,DUR+1,(t,s)=>{
  const f=lin(t,s,s+0.5), lg=lin(t,s+0.15,s+0.8), n1=lin(t,s+0.45,s+0.8), n2=lin(t,s+0.7,s+1.05), n3=lin(t,s+0.95,s+1.3), n4=lin(t,s+1.2,s+1.55);
  let h=bg('wide.jpg',{pos:'60% 50%',scale:1.2,filter:'blur(16px) brightness(.45) saturate(1.2)'});
  h+=grad('radial-gradient(ellipse at 50% 40%,rgba(120,40,160,.35),rgba(12,4,20,.85) 72%)');
  h+=`<div class="L" style="background:#fff;opacity:${1-f}"></div>`;
  h+=`<div style="position:absolute;left:50%;top:330px;width:400px;height:389px;transform:translateX(-50%) scale(${0.7+0.3*eBack(lg)});opacity:${eOut(lg)};filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))"><img src="logo.png" style="width:100%;height:100%"></div>`;
  h+=`<div class="c P" style="top:790px;font-size:160px;font-weight:900;letter-spacing:-2px;${up(n1)}">지금바레</div>
      <div class="c" style="top:985px;font-size:52px;letter-spacing:14px;color:${CREAM};opacity:${eOut(n1)}">NOW BARRE</div>
      <div class="c" style="top:1100px;font-size:100px;font-weight:900;color:${YEL};letter-spacing:-2px;opacity:${eOut(n2)};transform:scale(${1.25-0.25*eOut(n2)})">11.16 GRAND OPEN</div>
      <div class="c P" style="top:1250px;font-size:84px;${up(n3)}">광교에듀타운점</div>
      <div class="c ital" style="top:1370px;font-size:70px;color:${LAV};opacity:${eOut(n4)}">ladies only</div>`;
  return h;
});

window.DUR=DUR;
window.renderAt=(t)=>{
  let h='';
  for(const sc of scenes){ if(t>=sc.s && t<sc.e){ h=sc.fn(t,sc.s); break; } }
  h+=`<div class="L" style="background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.4) 100%)"></div>`;
  S.innerHTML=h;
};
window.preload=async()=>{
  const srcs=['barre_v.jpg','wide.jpg','curtain.jpg','lounge.jpg','desk.png','entrance.jpg','sign.jpg','dark.jpg','room2.jpg','bokeh.jpg'].map(x=>'img/'+x).concat(['logo.png']);
  window._keep=await Promise.all(srcs.map(src=>{const i=new Image();i.src=src;return i.decode().then(()=>i);}));
  await document.fonts.load("900 100px Pret","지금바레 GRAND");await document.fonts.load("italic 600 50px Corm","ladies");
  await document.fonts.ready;
};
</script></body></html>
